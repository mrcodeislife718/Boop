name: Boop Core CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: boop
          POSTGRES_PASSWORD: boop
          POSTGRES_DB: boop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boop -d boop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://boop:boop@127.0.0.1:5432/boop_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
